[package]
name = "asset-tracker"
version = "0.2.0"
description = "Track gold, silver, crypto, currencies and stocks with live prices"
authors = ["Asset Tracker contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "asset_tracker_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = { version = "2.9.0", features = ["unsafe-headers"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
tauri-plugin-opener = "2.7.3"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tauri-plugin-notification = "2.8.1"
tauri-plugin-single-instance = "2.5.5"

# Smaller debug builds (saves several GB of disk): no debug info for dependencies.
[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
